# These paths contain intentional fake fixtures/golden outputs used by tests.
# Keep this list narrow so real product code, workflows, docs, and views remain scanned.
paths-ignore:
  - "spec/clec/cert.rb"
  - "spec/lib/github_spec.rb"
  - "spec/lib/ssh_key_spec.rb"
  - "spec/model/postgres/postgres_resource_spec.rb"
  - "spec/model/postgres/postgres_server_spec.rb"
  - "spec/routes/api/cli/golden-files/**"
  - "spec/routes/api/cli/pg/pg_dumpall_spec.rb"
  - "spec/routes/api/cli/pg/psql_pg_dump_spec.rb"
  - "spec/routes/api/cli/pg/show_spec.rb"
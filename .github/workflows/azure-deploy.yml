name: Deploy LayerRail to Azure

on:
  push:
    branches:
      - layerrail-rebrand-start
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: c2494d2b-1b17-4123-ae06-60bb30487d9b
  AZURE_TENANT_ID: 0621cf68-51e6-470a-818e-e97563de3974
  AZURE_SUBSCRIPTION_ID: 2b5d6bd8-700a-4f94-b0c0-c55ae046c080
  AZURE_RESOURCE_GROUP: rg-layerrail-prod
  ACR_NAME: layerrailregistry
  IMAGE_NAME: layerrail
  WEB_APP_NAME: layerrail-web
  RESPIRATE_APP_NAME: layerrail-respirate
  MONITOR_APP_NAME: layerrail-monitor

jobs:
  build-and-deploy:
    name: Build and deploy container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query loginServer -o tsv)"
          IMAGE_SHA="$LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}"
          IMAGE_PROD="$LOGIN_SERVER/$IMAGE_NAME:prod"

          docker build \
            --tag "$IMAGE_SHA" \
            --tag "$IMAGE_PROD" \
            .

          docker push "$IMAGE_SHA"
          docker push "$IMAGE_PROD"

          echo "IMAGE_SHA=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Deploy web app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          images: ${{ env.IMAGE_SHA }}

      - name: Deploy respirate worker
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.RESPIRATE_APP_NAME }}
          images: ${{ env.IMAGE_SHA }}

      - name: Deploy monitor worker
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.MONITOR_APP_NAME }}
          images: ${{ env.IMAGE_SHA }}

      - name: Restart apps
        shell: bash
        run: |
          set -euo pipefail
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$WEB_APP_NAME"
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$RESPIRATE_APP_NAME"
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$MONITOR_APP_NAME"

      - name: Run database migrations
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting 30 seconds for apps to start..."
          sleep 30
            LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query loginServer -o tsv)"
            MIGRATION_CONTAINER="layerrail-migrate-${{ github.run_id }}"
            ACR_PASSWORD="$(az acr credential show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query 'passwords[0].value' -o tsv)"
          
            # Get database URL and other mandatory secrets from web app configuration
            DB_URL="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$WEB_APP_NAME" --query '[?name==`CLOVER_DATABASE_URL`].value' -o tsv)"
            ENC_KEY="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$WEB_APP_NAME" --query '[?name==`CLOVER_COLUMN_ENCRYPTION_KEY`].value' -o tsv)"
            SESSION_SECRET="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$WEB_APP_NAME" --query '[?name==`CLOVER_SESSION_SECRET`].value' -o tsv)"
          
            if [ -z "$DB_URL" ]; then
              echo "Error: CLOVER_DATABASE_URL not found in app configuration"
              exit 1
            fi
          
            echo "Running database migrations in container..."
            az container create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$MIGRATION_CONTAINER" \
              --image "$LOGIN_SERVER/$IMAGE_NAME:prod" \
              --registry-login-server "$LOGIN_SERVER" \
              --registry-username "$ACR_NAME" \
              --registry-password "$ACR_PASSWORD" \
              --cpu 2 \
              --memory 2 \
              --os-type Linux \
              --restart-policy Never \
              --environment-variables CLOVER_DATABASE_URL="$DB_URL" CLOVER_COLUMN_ENCRYPTION_KEY="$ENC_KEY" CLOVER_SESSION_SECRET="$SESSION_SECRET" RACK_ENV=production \
              --command-line "bundle exec rake prod_up"
          
            echo "Waiting for migration container to complete..."
            for i in {1..120}; do
              STATUS=$(az container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$MIGRATION_CONTAINER" --query 'containers[0].instanceView.currentState.state' -o tsv 2>/dev/null || echo "Creating")
              echo "Migration status ($i/120): $STATUS"
              if [ "$STATUS" = "Terminated" ]; then
                EXIT_CODE=$(az container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$MIGRATION_CONTAINER" --query 'containers[0].instanceView.currentState.exitCode' -o tsv)
                echo "Exit code: $EXIT_CODE"
                if [ "$EXIT_CODE" = "0" ]; then
                  echo "✓ Migrations completed successfully!"
                else
                  echo "✗ Migrations failed. Logs:"
                  az container logs --resource-group "$AZURE_RESOURCE_GROUP" --name "$MIGRATION_CONTAINER" || true
                  exit 1
                fi
                break
              fi
              sleep 5
            done
          
            echo "Cleaning up migration container..."
            az container delete --resource-group "$AZURE_RESOURCE_GROUP" --name "$MIGRATION_CONTAINER" --yes 2>/dev/null || true

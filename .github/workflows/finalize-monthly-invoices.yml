name: Monthly Invoice Scheduler Check

# Production finalization runs in the Render respirate worker. Do not send
# invoices from the retired Azure deployment or a second cron scheduler.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Locate the active invoice scheduler
        run: |
          echo "Monthly invoices run in LayerRail's Render worker (FinalizeMonthlyInvoices)."
          echo "For audited historical backfills, run bin/finalize-monthly-invoices on the current Render release."
